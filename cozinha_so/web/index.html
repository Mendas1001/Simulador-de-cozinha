<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozinha SO · FCFS × SJF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Barra superior: controles da simulação ===== -->
  <header class="topo">
    <div class="marca">
      <span class="marca-icone">🍳</span>
      <div>
        <h1>Cozinha SO</h1>
        <p>Escalonamento FCFS × SJF com threads e exclusão mútua</p>
      </div>
    </div>

    <div class="controles">
      <label>Cozinheiros
        <input type="number" id="cozinheiros" min="1" max="5" value="2">
      </label>
      <label>Velocidade
        <select id="escala">
          <option value="0.6">Lenta</option>
          <option value="0.3" selected>Normal</option>
          <option value="0.12">Rápida</option>
        </select>
      </label>
      <label>Carga de pedidos
        <select id="carga">
          <option value="aleatoria" selected>Aleatória (muda a cada rodada)</option>
          <option value="padrao">Padrão fixa (8 pedidos)</option>
        </select>
      </label>
      <label id="lbl-n">Pedidos
        <input type="number" id="n" min="1" max="30" value="10">
      </label>
      <label id="lbl-seed">Seed
        <input type="text" id="seed" placeholder="nova a cada vez" size="13">
      </label>
      <label class="chave" title="Desligue para demonstrar a condição de corrida">
        <span>Sincronização (Lock)</span>
        <span class="chave-corpo">
          <input type="checkbox" id="sync" checked>
          <span class="trilho"><span class="bola"></span></span>
          <em id="sync-txt">Ligada (seguro)</em>
        </span>
      </label>
      <button id="btn-iniciar" type="button">▶ Iniciar simulação</button>
      <span id="status" class="status">Pronto</span>
    </div>
  </header>

  <main>
    <!-- Estado vazio, antes da primeira simulação -->
    <section id="vazio" class="vazio-inicial">
      <div class="vazio-emoji">👨‍🍳🍕🍝🍣</div>
      <h2>A cozinha está vazia</h2>
      <p>Escolha as opções acima e clique em <strong>Iniciar simulação</strong>.
         FCFS e SJF vão receber exatamente os mesmos pedidos e rodar lado a lado.</p>
    </section>

    <!-- Painéis FCFS e SJF (montados por app.js) -->
    <section id="paineis" class="paineis"></section>

    <!-- Comparativo final (aparece quando a simulação termina) -->
    <section id="comparativo" class="comparativo" hidden></section>
  </main>

  <!-- ===== Template de um painel (um por algoritmo) ===== -->
  <template id="tpl-painel">
    <article class="painel">
      <header class="painel-topo">
        <div>
          <h2 class="alg-titulo"></h2>
          <p class="alg-desc"></p>
          <p class="modo" data-el="modo"></p>
        </div>
        <div class="relogio">
          <small>tempo</small>
          <strong data-el="relogio">0.0</strong>
          <span class="selo" data-el="selo">em andamento</span>
        </div>
      </header>

      <div class="alerta" data-el="alerta" hidden></div>

      <div class="bloco">
        <h3>📥 Esteira de pedidos <small data-el="faltam"></small></h3>
        <div class="esteira" data-el="esteira"></div>
      </div>

      <div class="bloco">
        <h3>👨‍🍳 Cozinheiros</h3>
        <div class="estacoes" data-el="estacoes"></div>
      </div>

      <div class="bloco">
        <h3>🛵 Saída para entrega</h3>
        <div class="entrega" data-el="entrega"></div>
      </div>

      <div class="bloco">
        <h3>📊 Gráfico de Gantt ao vivo</h3>
        <div class="gantt" data-el="gantt"></div>
      </div>

      <div class="metricas">
        <div><small>Concluídos</small><strong data-el="m-conc">0/0</strong></div>
        <div><small>Na fila agora</small><strong data-el="m-fila">0</strong></div>
        <div><small>TME parcial</small><strong data-el="m-tme">—</strong></div>
        <div data-el="box-conf" hidden><small>Conflitos</small><strong data-el="m-conf">0</strong></div>
      </div>

      <details class="logbox" data-el="logbox">
        <summary>Log em tempo real (saída do console)</summary>
        <div class="log" data-el="log"></div>
      </details>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
